name: PRONOUS wallet state repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wallet state handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desk-app.js')
          s=p.read_text()
          old="""async function simulate(){const el=document.getElementById('plan');const t=(document.getElementById('ticker').value||'NVDA').trim().toUpperCase();if(!walletAddress){el.textContent='Connect wallet before simulation.';return}"""
          new="""async function simulate(){const el=document.getElementById('plan');const t=(document.getElementById('ticker').value||'NVDA').trim().toUpperCase();const walletApi=window.PRONOUS_WALLET;try{if(walletApi&&typeof walletApi.sync==='function')await walletApi.sync()}catch(_){}const liveWallet=walletApi&&typeof walletApi.getAddress==='function'?walletApi.getAddress():walletAddress;if(liveWallet&&String(liveWallet).toLowerCase()!==String(walletAddress||'').toLowerCase()){setWalletUI(liveWallet,typeof walletApi.getSource==='function'?walletApi.getSource():walletSource,typeof walletApi.getChainId==='function'?walletApi.getChainId():walletChainId)}if(!liveWallet){el.textContent='Connect wallet before simulation.';return}if(typeof walletApi.getChainId==='function'&&Number(walletApi.getChainId())!==56){el.textContent='Switch wallet to BSC Mainnet before simulation.';return}"""
          if old not in s: raise SystemExit('simulate anchor not found')
          s=s.replace(old,new,1)
          old="""const sr=await fetch('/api/agent?action=simulateTx&ticker='+encodeURIComponent(t)+'&evmTx='+encodeURIComponent(JSON.stringify(tx)));"""
          new="""const simulationWallet=walletApi&&typeof walletApi.getAddress==='function'?walletApi.getAddress():walletAddress;if(!simulationWallet){el.textContent='Wallet disconnected before simulation.';return}const sr=await fetch('/api/agent?action=simulateTx&ticker='+encodeURIComponent(t)+'&userWalletAddress='+encodeURIComponent(simulationWallet)+'&evmTx='+encodeURIComponent(JSON.stringify(tx)));"""
          if old not in s: raise SystemExit('simulation fetch anchor not found')
          s=s.replace(old,new,1)
          old="""const{api,address}=await resolveWalletForAnchor();if(!api||typeof api.request!=='function')"""
          new="""const{api,address,chainId}=await resolveWalletForAnchor();if(!api||typeof api.request!=='function')"""
          if old not in s: raise SystemExit('anchor wallet destructure not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check desk-app.js
          git diff --check
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desk-app.js
          git rm -f .github/workflows/pronous-wallet-state-fix.yml
          git commit -m 'Fix wallet state propagation for BSC simulation and anchor'
          git push