name: PRONOUS One-shot UI Repair 2

on:
  push:
    branches: ["feat/institutional-ui-pass"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feat/institutional-ui-pass
      - name: Apply and verify UI repair
        run: node scripts/one-shot-ui-repair.mjs
      - name: Commit repaired UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): populate on-chain dashboard and tighten density"
          git push origin HEAD:feat/institutional-ui-pass
