name: Repair PRONOUS execution gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dry-run confirmation gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desk-app.js')
          s=p.read_text()
          old="""if(currentPOA.status!=='SIMULATED'){const s=document.getElementById('poaGateStatus');if(s)s.textContent='Simulation must pass before confirmation.';return}"""
          new="""if(currentPOA.status!=='SIMULATED'||currentPOA.simulation?.mode!=='BSC_RPC'||currentPOA.simulation?.status!=='PASSED'){const s=document.getElementById('poaGateStatus');if(s)s.textContent='Only a passed BSC RPC simulation can unlock confirmation.';return}"""
          if old not in s:
              raise SystemExit('expected confirmation gate not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk-app.js
          git commit -m "Fix execution gate to require passed BSC simulation"
          git push
      - name: Remove one-shot repair workflow
        run: |
          rm -f .github/workflows/repair-execution-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-execution-gate.yml
          git commit -m "Remove one-shot execution gate repair workflow"
          git push
