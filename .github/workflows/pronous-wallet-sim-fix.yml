name: PRONOUS wallet simulation compatibility patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch simulation wallet-state contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/agent.js')
          s = p.read_text()
          old = '''      const raw=url.searchParams.get("evmTx");
      const userWalletAddress=String(url.searchParams.get("userWalletAddress")||"").trim();
      if(!isAddress(userWalletAddress)) return res.status(400).json({error:"userWalletAddress is required for simulation"});
      if(!raw) return res.status(400).json({error:"evmTx JSON query parameter is required"});'''
          new = '''      const raw=url.searchParams.get("evmTx");
      if(!raw) return res.status(400).json({error:"evmTx JSON query parameter is required"});
      let evmTx;
      try { evmTx=JSON.parse(raw); } catch (_) { return res.status(400).json({error:"Invalid evmTx JSON"}); }
      if(!evmTx || typeof evmTx!=="object" || Array.isArray(evmTx))
        return res.status(400).json({error:"Invalid simulation transaction"});
      const suppliedWallet=String(url.searchParams.get("userWalletAddress")||"").trim();
      const txWallet=String(evmTx.from||"").trim();
      const userWalletAddress=suppliedWallet || txWallet;
      if(!isAddress(userWalletAddress)) return res.status(400).json({error:"userWalletAddress is required for simulation"});
      if(suppliedWallet && !isAddress(suppliedWallet)) return res.status(400).json({error:"Invalid userWalletAddress"});
      if(txWallet && !isAddress(txWallet)) return res.status(400).json({error:"Simulation transaction has an invalid from address"});
      if(txWallet && txWallet.toLowerCase()!==userWalletAddress.toLowerCase()) return res.status(403).json({error:"Simulation wallet mismatch"});'''
          if old not in s:
              raise SystemExit('Expected simulation block not found; refusing to modify api/agent.js')
          s = s.replace(old, new, 1)
          old2 = '''      let evmTx;
      try { evmTx=JSON.parse(raw); } catch (_) { return res.status(400).json({error:"Invalid evmTx JSON"}); }
      if(!evmTx || typeof evmTx!=="object" || Array.isArray(evmTx))
        return res.status(400).json({error:"Invalid simulation transaction"});
      if(evmTx.from && !isAddress(evmTx.from))
        return res.status(400).json({error:"Simulation transaction has an invalid from address"});
      if(evmTx.from && evmTx.from.toLowerCase()!==userWalletAddress.toLowerCase())
        return res.status(403).json({error:"Simulation wallet mismatch"});
'''
          s = s.replace(old2, '', 1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          node --check api/agent.js
          grep -n 'const suppliedWallet\|const txWallet\|Simulation wallet mismatch' api/agent.js
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/agent.js
          git rm -f .github/workflows/pronous-wallet-sim-fix.yml scripts/.wallet-sim-fix-trigger 2>/dev/null || true
          git commit -m 'Fix wallet state compatibility for BSC simulation' || exit 0
          git push
