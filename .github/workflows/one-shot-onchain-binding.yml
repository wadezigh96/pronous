name: PRONOUS One-shot On-chain Binding

on:
  push:
    branches: ["feat/institutional-ui-pass"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feat/institutional-ui-pass
      - name: Bind loader and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('desk-onchain.js')
          s = p.read_text()
          marker = '  async function autoLoadOnchain() {'
          binding = '  window.loadOnchain = loadOnchain;\n\n' + marker
          if 'window.loadOnchain = loadOnchain;' not in s:
              if marker not in s:
                  raise SystemExit('autoLoadOnchain marker not found')
              s = s.replace(marker, binding, 1)
              p.write_text(s)
          t = Path('scripts/ui-regression.test.mjs')
          ts = t.read_text()
          if 'window\\.loadOnchain\\s*=\\s*loadOnchain' not in ts:
              ts = ts.replace('assert.match(onchain, /autoLoadOnchain\\(\\)/);', 'assert.match(onchain, /autoLoadOnchain\\(\\)/); assert.match(onchain, /window\\.loadOnchain\\s*=\\s*loadOnchain/);')
              t.write_text(ts)
          PY
          node --check desk-onchain.js
          node --test scripts/ui-regression.test.mjs
          rm -f .github/workflows/one-shot-onchain-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): bind on-chain loader for automatic asset hydration"
          git push origin HEAD:feat/institutional-ui-pass
