name: Agent Workspace Build

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "pronous/**"
      - ".github/workflows/agent-workspace-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "pronous/**"
      - ".github/workflows/agent-workspace-build.yml"

permissions:
  contents: read

jobs:
  build-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
      - name: Install seller workspace dependencies
        working-directory: pronous
        run: pnpm install --frozen-lockfile
      - name: Compile BNB Agent Studio workspace
        working-directory: pronous
        run: pnpm --filter pronous-agent run build
      - name: Test verified live-data policy
        working-directory: pronous
        run: pnpm --filter pronous-agent exec tsx --test src/pronousResearch.test.ts
