name: Repair live simulation UI gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace dry-run simulation with chain simulation gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desk-app.js')
          s=p.read_text()
          start=s.index('async function simulate(){')
          end=s.index('\nasync function ask(){', start)
          new='''async function simulate(){\n const t=(document.getElementById('ticker').value||'NVDA').trim().toUpperCase();\n if(!preflightReady){document.getElementById('plan').textContent='Run a successful preflight first.';return;}\n if(!walletProvider||!walletAddress){document.getElementById('plan').textContent='Connect the execution wallet before chain simulation.';return;}\n if(!latestQuote?.evmTx){document.getElementById('plan').textContent='Build an unsigned transaction from a live quote first.';return;}\n document.getElementById('plan').textContent='Running BSC RPC simulation…';\n try{\n  const r=await fetch('/api/agent?'+new URLSearchParams({action:'simulateTx',ticker:t,evmTx:JSON.stringify(latestQuote.evmTx)}).toString());\n  const j=await r.json();\n  if(!r.ok||j.status==='FAILED'||j.simulation?.status!=='PASSED')throw new Error(j.reason||j.error||'BSC RPC simulation failed');\n  latestQuote={...latestQuote,simulation:j};\n  await createPOAForAction('SIMULATION','SIMULATED',{asset:latestQuote.asset||null,simulation:{mode:'BSC_RPC',status:'PASSED',gasEstimate:j.simulation?.gasEstimate||null}});\n  setExecutionStep('simulation','PASSED');\n  const cb=document.getElementById('confirmActionBtn');if(cb)cb.disabled=false;\n  const gs=document.getElementById('poaGateStatus');if(gs)gs.textContent='BSC RPC simulation passed. Explicit wallet confirmation is now available.';\n  document.getElementById('plan').textContent=JSON.stringify(j,null,2);\n }catch(e){document.getElementById('plan').textContent='BSC simulation error: '+e.message;}\n}'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commit repaired UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk-app.js
          git commit -m "Use live BSC RPC simulation before wallet confirmation"
          git push
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/repair-live-simulation-ui.yml
          git add .github/workflows/repair-live-simulation-ui.yml
          git commit -m "Remove one-shot simulation UI repair workflow"
          git push
