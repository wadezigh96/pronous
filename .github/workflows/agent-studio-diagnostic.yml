name: Agent Studio Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Check runtimes
        run: |
          node --version
          npm --version
          bun --version

      - name: Install Agent Studio CLI
        run: |
          npm install -g @bnbagent/studio-cli
          bag --version

      - name: Check deployment CLI
        run: |
          command -v bag
          bag deploy --help
          echo "DIAGNOSTIC_ONLY=1"

      - name: Repository safety check
        run: |
          git status --short
          git diff --check
