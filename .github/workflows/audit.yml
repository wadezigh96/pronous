name: PRONOUS Audit

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: One-off live derived-price evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/derived-price-radar'
        run: node scripts/verify-derived-price.mjs
        env:
          PRONOUS_ASSETS_URL: https://pronous.vercel.app/api/agent?action=assets
      - name: One-off PancakeSwap quote measurements
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/derived-price-radar'
        run: node scripts/measure-quotes.mjs
        env:
          PRONOUS_ASSETS_URL: https://pronous.vercel.app/api/agent?action=assets
          PRONOUS_QUOTE_MAX_TICKERS: 3
      - name: Upload read-only measurement evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/derived-price-radar'
        uses: actions/upload-artifact@v4
        with:
          name: derived-price-analysis
          path: docs/derived-price-analysis.json
          if-no-files-found: warn
      - name: Upload quote measurement evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/derived-price-radar'
        uses: actions/upload-artifact@v4
        with:
          name: quote-measurements
          path: docs/quote-measurements.json
          if-no-files-found: warn
