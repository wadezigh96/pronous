name: Restore desk and wire Agent Studio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore desk-app from known-good commit and add Studio helpers
        run: |
          git fetch --no-tags origin 335c99a33fd13fc634e5bf3f848dea7234e12e8d
          git show 335c99a33fd13fc634e5bf3f848dea7234e12e8d:desk-app.js > desk-app.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desk-app.js')
          s=p.read_text()
          helpers="""\n// Agent Studio UX helpers — source contract: agent/AGENT_STUDIO_PROMPT.md\nconst PRONOUS_AGENT_STUDIO_PROMPT='Create and deploy a BSC mainnet autonomous agent named PRONOUS. Monitor tokenized equities through Binance Web3 API; search tickers; read token/reference prices; calculate spread; check market status; create transparent execution plans. Enforce scoped wallet policy, spend caps, contract allowlists, spot-only execution, simulation before broadcast, structured intents, and explicit user confirmation. Expose market, price, portfolio, quote, simulation and execution tools with secrets server-side. Register ERC-8004 identity, expose ERC-8183 tasks, enable x402 self-funding, and keep read-only/demo mode available when unfunded.';\nfunction copyAgentStudioPrompt(){const f=document.getElementById('studioFeedback');const done=()=>{if(f)f.textContent='Deploy prompt copied.'};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(PRONOUS_AGENT_STUDIO_PROMPT).then(done).catch(()=>fallbackCopyAgentStudioPrompt(done));else fallbackCopyAgentStudioPrompt(done)}\nfunction fallbackCopyAgentStudioPrompt(done){const ta=document.createElement('textarea');ta.value=PRONOUS_AGENT_STUDIO_PROMPT;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){const f=document.getElementById('studioFeedback');if(f)f.textContent='Copy unavailable — use agent/AGENT_STUDIO_PROMPT.md'}ta.remove()}\nfunction openAgentStudioDocs(){window.open('https://www.bnbchain.org/en/bnb-agent-studio','_blank','noopener,noreferrer')}\n"""
          p.write_text(helpers+s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk-app.js
          git commit -m "Restore desk runtime and wire Agent Studio UX"
          git push
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/restore-desk-and-studio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/restore-desk-and-studio.yml
          git commit -m "Remove one-shot desk repair workflow"
          git push
